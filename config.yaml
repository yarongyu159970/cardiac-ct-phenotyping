endpoint:
  id: ID
  code: MACET
  time_months: TIME
  no_event: 0
  hard_mace: 1
  soft_mace: 2

preprocessing:
  pca_variance_threshold: 0.90
  pca_metrics: [MBF, MBV, TTP, PCBV, FE]
  correlation_threshold: 0.90
  categorical_max_unique: 6
  eta_squared_threshold: 0.80
  eta_squared_whitelist: [gender]

clustering:
  candidate_k: [2, 3, 4, 5]
  reported_primary_k: 3
  init: Cao
  n_init: 10
  seed_repeats: 20
  reference_seed: 15
  random_state: 0
  gamma: null
  bootstrap_repeats: 100
  bootstrap_n_init: 10
  stability_sampling: subsample
  stability_fraction: 0.80
  stability_preserve_draw_order: false
  stability_random_state: 0
  display_order_variable: Total plaque volume
  stability_thresholds:
    mean_bootstrap_ari: 0.75
    mean_cluster_jaccard: 0.75
    minimum_cluster_fraction: 0.10

projection:
  label_column: Cluster
  features:
    - Total plaque volume
    - CT-FFR-RCA
    - LAD_MBF
    - RCA_PCBV
    - TC
    - CT-FFR-LcX
    - LAD_PCBV
    - IMV
    - low attenuation volume
    - HbA1c
    - LAD_TTP
    - FG
    - CT-FFR-LAD
  selected_c: 2.782559402207126
  c_grid:
    - 0.0001
    - 0.000774263682681127
    - 0.005994842503189409
    - 0.046415888336127774
    - 0.3593813663804626
    - 2.782559402207126
    - 21.54434690031882
    - 166.81005372000558
    - 1291.5496650148827
    - 10000.0
  scoring: neg_log_loss
  class_weight: balanced
  solver: saga
  penalty: l2
  cv_folds: 5
  cv_repeats: 5
  max_iter: 20000
  tolerance: 0.0001
  random_state: 42

feature_selection:
  categorical_max_unique: 6
  dummy_drop_first: false
  require_top_n_membership_match: true

feature_count:
  min_features: 5
  max_features: 15
  near_best_tolerance: 0.010
  primary_metrics: [balanced_accuracy_mean, macro_f1_mean]
  solver: lbfgs
  max_iter: 20000

table_statistics:
  derivation_pairwise_correction: holm
  validation_pairwise_correction: holm

survival:
  cox_penalizer: 0.01
  ph_test_alpha: 0.05
  random_state: 42
  bootstrap_repeats: 200
  evaluation_months: [36, 60]
  ibs_grid_start_month: 3.0
  ibs_grid_points: 1000
  hard_bootstrap_repeats: 1000
  hard_ci_outer_repeats: 500
  hard_ci_inner_repeats: 50
  comparison_null_repeats: 4999
  calibration_bootstrap_repeats: 5000
  model_a: [age, gender, SBP, Antihypertensive medication, TC, HDL, smoking, DM]
  model_b_add: [CAD-RADS]
  model_c_add: [Cluster]
  interaction_medications: [Antiplatelet therapy, Antihypertensive medication, Antidiabetic medication, Antiischemic medication, Nitrates, Statin]
